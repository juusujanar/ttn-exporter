{{- if and .Values.secret.create (not .Values.apiKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ttn-exporter.fullname" . }}
  labels:
    {{- include "ttn-exporter.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  TTN_API_KEY: {{ required "apiKey.value is required when secret.create=true and apiKey.existingSecret is unset (set apiKey.value, or set apiKey.existingSecret + apiKey.existingSecretKey to use your own Secret)" .Values.apiKey.value | b64enc }}
{{- end }}
