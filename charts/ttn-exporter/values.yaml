# -- Number of replicas.
replicaCount: 1

image:
  # -- Image repository. Also published to janarj/ttn-exporter on Docker Hub; override to use that instead.
  repository: ghcr.io/juusujanar/ttn-exporter
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to "v" + Chart.yaml appVersion (e.g. "v1.5.0") when empty.
  tag: ""

# -- References to secrets for pulling the image from a private registry.
imagePullSecrets: []
# -- Override the chart name used in generated resource names.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""

# -- Port the exporter's HTTP server (landing page + metrics) listens on inside the container.
containerPort: 9981

serviceAccount:
  # -- Whether a ServiceAccount should be created.
  create: true
  # -- Whether to automount the ServiceAccount token. The exporter never calls the Kubernetes API, so this is false by default.
  automount: false
  # -- Annotations to add to the ServiceAccount.
  annotations: {}
  # -- Name of the ServiceAccount to use. If not set and create is true, a name is generated.
  name: ""

# -- Annotations to add to the pod.
podAnnotations: {}
# -- Extra labels to add to the pod.
podLabels: {}
# -- Extra labels added to all chart resources.
commonLabels: {}

# -- Pod-level security context. Defaults match the container image, which runs as the "nobody" (65534) user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534

service:
  # -- Kubernetes Service type.
  type: ClusterIP
  # -- Service port. Also used as the target for the named "http" container port.
  port: 9981
  # -- Annotations to add to the Service (e.g. classic prometheus.io/scrape annotations).
  annotations: {}

ttn:
  # -- Things Stack base URI. Maps to the ttn.uri flag.
  uri: "https://eu1.cloud.thethings.network/"
  # -- Verify the TLS certificate of the Things Stack API endpoint. Maps to the ttn.ssl-verify flag.
  sslVerify: true
  # -- Timeout for each request to the Things Stack API. Maps to the ttn.timeout flag.
  timeout: 5s
  # -- Maximum number of concurrent per-gateway stats requests. Maps to the ttn.concurrency flag.
  concurrency: 5

web:
  # -- Path under which metrics are exposed. Maps to the web.telemetry-path flag.
  telemetryPath: /metrics
  # -- Path to an exporter-toolkit web.config.file (TLS/basic-auth for the exporter's own HTTP
  # server). Advanced; if set, mount the file via extraVolumes/extraVolumeMounts.
  configFile: ""

log:
  # -- Log level. Maps to the log.level flag.
  level: info
  # -- Log format (logfmt or json). Maps to the log.format flag.
  format: logfmt

apiKey:
  # -- TTN_API_KEY value. Ignored when apiKey.existingSecret is set. Required when secret.create is true.
  value: ""
  # -- Name of a pre-existing Secret containing the API key. Leave empty to let the chart manage the Secret via apiKey.value.
  existingSecret: ""
  # -- Key within apiKey.existingSecret that holds the API key.
  existingSecretKey: "TTN_API_KEY"

secret:
  # -- Create a Secret from apiKey.value. Only relevant when apiKey.existingSecret is empty.
  create: true
  # -- Annotations to add to the chart-managed Secret.
  annotations: {}

# -- Additional raw CLI arguments appended after the generated flags.
extraArgs: []
# -- Additional environment variables, as a list of full EnvVar objects.
extraEnv: []
# -- Additional envFrom entries, as a list of full EnvFromSource objects.
extraEnvFrom: []
# -- Additional volumes on the pod.
extraVolumes: []
# -- Additional volumeMounts on the container.
extraVolumeMounts: []

# -- Container resource requests/limits.
resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi

# -- Liveness probe. Targets "/" (the static landing page), never the metrics path, since
# scraping /metrics triggers a real synchronous call to the TTN API.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

# -- Readiness probe. See livenessProbe for why it targets "/".
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  # -- Enable a startup probe. Usually unnecessary; the binary starts near-instantly.
  enabled: false
  httpGet:
    path: /
    port: http
  failureThreshold: 30
  periodSeconds: 2

# -- Node labels for pod assignment.
nodeSelector: {}
# -- Tolerations for pod assignment.
tolerations: []
# -- Affinity rules for pod assignment.
affinity: {}
# -- Topology spread constraints for the pod.
topologySpreadConstraints: []
# -- Priority class name for the pod.
priorityClassName: ""

podDisruptionBudget:
  # -- Create a PodDisruptionBudget.
  enabled: false
  # -- Minimum number of pods that must remain available. Mutually exclusive with maxUnavailable.
  minAvailable: 1
  # -- Maximum number of pods that can be unavailable. Takes effect only when minAvailable is null.
  maxUnavailable:

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor. Requires the monitoring.coreos.com CRDs.
  enabled: false
  # -- Namespace to create the ServiceMonitor in. Defaults to the release namespace.
  namespace: ""
  # -- Scrape interval. Increase alongside scrapeTimeout for large gateway fleets.
  interval: 60s
  # -- Scrape timeout. Each scrape is a synchronous call chain bounded by ttn.concurrency; size
  # this together with ttn.timeout and gateway count.
  scrapeTimeout: 30s
  # -- Extra labels on the ServiceMonitor (e.g. to match a Prometheus Operator selector).
  labels: {}
  honorLabels: false
  relabelings: []
  metricRelabelings: []
  # -- Scheme to use for scraping. Set to https if TLS is enabled on the exporter (via web.configFile).
  scheme: http
  # -- TLS configuration for scraping (e.g., insecureSkipVerify: true).
  tlsConfig: {}

networkPolicy:
  # -- Create a NetworkPolicy restricting ingress to the exporter port.
  enabled: false
  # -- Ingress `from` peers. Empty (default) allows traffic from any source (only the port is
  # restricted); set this to scope scraping to your monitoring namespace/pods.
  from: []
  egress:
    # -- Allow all egress. Required in practice since the TTN API host can't be scoped by CIDR;
    # set to false to leave egress ungoverned by this policy instead.
    enabled: true
